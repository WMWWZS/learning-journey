<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="技能与学习数据面板">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#13102a"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ec4899"/><stop offset="100%" stop-color="#f9a8d4"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="18" fill="url(#panel)"/>
  <rect x="1" y="1" width="1198" height="358" rx="17" fill="none" stroke="url(#edge)" stroke-opacity="0.55" stroke-width="1.5"/>

  <text x="48" y="52" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="18" fill="#e2e8f0" letter-spacing="2">技能进度</text>
  <text x="160" y="52" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#64748b" letter-spacing="2">SKILLS</text>

  <!-- 技能条 -->
  <g font-family="'Microsoft YaHei','PingFang SC',sans-serif">
    <text x="48" y="104" font-size="15" fill="#cbd5e1">C++</text>
    <rect x="170" y="90" width="420" height="16" rx="8" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="170" y="90" width="0" height="16" rx="8" fill="url(#bar1)" filter="url(#softglow)">
      <animate attributeName="width" values="0;252;252" dur="2.4s" fill="freeze"/>
    </rect>
    <text x="620" y="104" font-size="14" fill="#67e8f9">45%</text>

    <text x="48" y="152" font-size="15" fill="#cbd5e1">Qt Widgets</text>
    <rect x="170" y="138" width="420" height="16" rx="8" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="170" y="138" width="0" height="16" rx="8" fill="url(#bar2)" filter="url(#softglow)">
      <animate attributeName="width" values="0;196;196" dur="2.6s" fill="freeze"/>
    </rect>
    <text x="620" y="152" font-size="14" fill="#c4b5fd">35%</text>

    <text x="48" y="200" font-size="15" fill="#cbd5e1">OpenCV</text>
    <rect x="170" y="186" width="420" height="16" rx="8" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="170" y="186" width="0" height="16" rx="8" fill="url(#bar3)" filter="url(#softglow)">
      <animate attributeName="width" values="0;84;84" dur="2.8s" fill="freeze"/>
    </rect>
    <text x="620" y="200" font-size="14" fill="#f9a8d4">15%</text>

    <text x="48" y="248" font-size="15" fill="#cbd5e1">Linux</text>
    <rect x="170" y="234" width="420" height="16" rx="8" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="170" y="234" width="0" height="16" rx="8" fill="url(#bar4)" filter="url(#softglow)">
      <animate attributeName="width" values="0;28;28" dur="3s" fill="freeze"/>
    </rect>
    <text x="620" y="248" font-size="14" fill="#fcd34d">5%</text>
  </g>

  <!-- 分隔线 -->
  <path d="M690 70V290" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- 右侧目标卡 -->
  <g font-family="'Microsoft YaHei','PingFang SC',sans-serif">
    <text x="740" y="104" font-size="15" fill="#94a3b8" letter-spacing="2">每日节奏</text>
    <text x="740" y="140" font-size="22" fill="#e2e8f0" font-weight="700">手写 30 min</text>
    <text x="740" y="168" font-size="13" fill="#64748b">关掉 AI 补全，纯手打</text>

    <text x="740" y="212" font-size="15" fill="#94a3b8" letter-spacing="2">每日提交</text>
    <text x="740" y="248" font-size="22" fill="#e2e8f0" font-weight="700">1 commit</text>
    <text x="740" y="276" font-size="13" fill="#64748b">当天代码必须推上去</text>

    <text x="960" y="104" font-size="15" fill="#94a3b8" letter-spacing="2">目标</text>
    <rect x="960" y="116" width="190" height="92" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="1055" y="158" text-anchor="middle" font-size="30" font-weight="800" fill="url(#bar2)">2027</text>
    <text x="1055" y="184" text-anchor="middle" font-size="12" fill="#64748b">暑假 · 第一份实习</text>

    <text x="960" y="248" font-size="13" fill="#64748b">状态</text>
    <circle cx="968" cy="266" r="5" fill="#4ade80">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="984" y="270" font-size="13" fill="#86efac">进行中</text>
  </g>
</svg>

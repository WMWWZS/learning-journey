<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="风林火山 · 学习成长记录">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05060d"/>
      <stop offset="55%" stop-color="#0d0b1f"/>
      <stop offset="100%" stop-color="#1a0b2e"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#a5f3fc"/>
      <stop offset="75%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#f9a8d4"/>
    </linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="blur60" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="440" fill="url(#bg)"/>

  <!-- 漂移光斑 -->
  <g filter="url(#blur60)" opacity="0.75">
    <g>
      <ellipse cx="200" cy="120" rx="260" ry="180" fill="#0ea5e9" opacity="0.55">
        <animateTransform attributeName="transform" type="translate" values="0,0; 60,-30; 0,0" dur="16s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    <g>
      <ellipse cx="1050" cy="90" rx="280" ry="190" fill="#8b5cf6" opacity="0.6">
        <animateTransform attributeName="transform" type="translate" values="0,0; -70,40; 0,0" dur="20s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    <g>
      <ellipse cx="900" cy="360" rx="260" ry="170" fill="#ec4899" opacity="0.45">
        <animateTransform attributeName="transform" type="translate" values="0,0; 50,-40; 0,0" dur="18s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    <g>
      <ellipse cx="380" cy="380" rx="220" ry="150" fill="#f59e0b" opacity="0.28">
        <animateTransform attributeName="transform" type="translate" values="0,0; -40,-50; 0,0" dur="22s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>

  <!-- 网格 -->
  <g stroke="#7dd3fc" stroke-opacity="0.07" stroke-width="1">
    <path d="M0 40H1280M0 80H1280M0 120H1280M0 160H1280M0 200H1280M0 240H1280M0 280H1280M0 320H1280M0 360H1280M0 400H1280"/>
    <path d="M40 0V440M80 0V440M120 0V440M160 0V440M200 0V440M240 0V440M280 0V440M320 0V440M360 0V440M400 0V440M440 0V440M480 0V440M520 0V440M560 0V440M600 0V440M640 0V440M680 0V440M720 0V440M760 0V440M800 0V440M840 0V440M880 0V440M920 0V440M960 0V440M1000 0V440M1040 0V440M1080 0V440M1120 0V440M1160 0V440M1200 0V440M1240 0V440"/>
  </g>

  <!-- 噪点 -->
  <rect width="1280" height="440" filter="url(#noise)" opacity="0.05"/>

  <!-- 装饰环 -->
  <g fill="none" stroke="url(#tag)" stroke-opacity="0.35" stroke-width="1.5">
    <circle cx="1080" cy="150" r="110"/>
    <circle cx="1080" cy="150" r="76" stroke-dasharray="5 7"/>
    <circle cx="1080" cy="150" r="40"/>
  </g>
  <circle cx="1080" cy="150" r="5" fill="#a78bfa" fill-opacity="0.9">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 标题 -->
  <g font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
    <text x="90" y="170" font-size="86" font-weight="800" fill="url(#title)" letter-spacing="6" filter="url(#glow)">风林火山</text>
    <text x="94" y="222" font-size="20" fill="#cbd5e1" letter-spacing="2">学习成长记录 · 用代码把每天钉在时间线上</text>
    <text x="90" y="300" font-size="0" fill="#000">占位</text>
  </g>

  <!-- 标签 -->
  <g font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15">
    <rect x="92" y="340" width="150" height="42" rx="21" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="167" y="367" text-anchor="middle" fill="#e2e8f0">C++ / Qt</text>

    <rect x="256" y="340" width="138" height="42" rx="21" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="325" y="367" text-anchor="middle" fill="#e2e8f0">OpenCV</text>

    <rect x="408" y="340" width="150" height="42" rx="21" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="483" y="367" text-anchor="middle" fill="#e2e8f0">工业视觉</text>

    <rect x="572" y="340" width="120" height="42" rx="21" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="632" y="367" text-anchor="middle" fill="#e2e8f0">Linux</text>
  </g>

  <!-- 底部进度光条 -->
  <rect x="92" y="404" width="1096" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.06"/>
  <rect x="92" y="404" width="420" height="3" rx="1.5" fill="url(#tag)">
    <animate attributeName="width" values="120;760;120" dur="9s" repeatCount="indefinite"/>
  </rect>

  <text x="92" y="428" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#64748b" letter-spacing="1">since 2026.11 · 每天手写 30 分钟 · 每天至少 1 个 commit</text>
</svg>

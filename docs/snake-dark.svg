<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="贡献蛇占位图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#13102a"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="220" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="218" rx="15" fill="none" stroke="url(#g)" stroke-opacity="0.5"/>
  <text x="600" y="96" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="30" font-weight="700" fill="url(#g)" letter-spacing="4">贡献蛇 · 每天自动更新</text>
  <text x="600" y="140" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#64748b" letter-spacing="2">等 GitHub Actions 跑完，这里会变成你的贡献格子动画</text>
</svg>

name: Generate contribution snake

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

concurrency:
  group: repo-data-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            docs/snake-light.svg?color_snake=#c2410c&color_dots=#ebedf0,#fed7aa,#fb923c,#ea580c,#9a3412
            docs/snake-dark.svg?palette=github-dark&color_snake=#fde68a&color_dots=#161b22,#4a1a0b,#9a3412,#ea580c,#fdba74

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/snake-light.svg docs/snake-dark.svg
          if git diff --cached --quiet; then
            echo "no changes, skip commit"
          else
            git commit -m "chore: update contribution snake [skip ci]"
            git push
          fi

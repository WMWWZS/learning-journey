name: Generate assets from progress

on:
  push:
    branches: [main]
    paths:
      - "docs/data/progress.json"
      - "assets/dashboard.template.svg"
      - "scripts/gen-assets.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate progress.js + dashboard.svg
        run: node scripts/gen-assets.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/progress.js assets/dashboard.svg README.md
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: regenerate progress assets [skip ci]"
            git push
          fi
